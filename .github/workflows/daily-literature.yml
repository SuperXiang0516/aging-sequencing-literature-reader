name: Daily sequencing and ageing literature reader

on:
  schedule:
    # GitHub uses UTC. This runs once each day; the exact minute is intentionally
    # not on the hour to reduce contention with other scheduled workflows.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      max_new:
        description: "本次最多发布的新文章数"
        required: false
        default: "5"
      candidate_limit:
        description: "本次从 Europe PMC 检查的候选数"
        required: false
        default: "40"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-literature
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep history so a transient/buggy run that wrote an empty state
          # can recover the latest non-empty published library snapshot.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recover a previous non-empty library snapshot
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          state_path = Path("data/automation-state.json")
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              state = {}
          if state.get("records"):
              print(f"当前状态已有 {len(state['records'])} 篇，跳过恢复。")
          else:
              commits = subprocess.check_output(
                  ["git", "log", "--format=%H", "--", str(state_path)], text=True
              ).splitlines()
              recovered = None
              for commit in commits[1:]:
                  try:
                      raw = subprocess.check_output(
                          ["git", "show", f"{commit}:{state_path}"], text=True
                      )
                      candidate = json.loads(raw)
                  except (OSError, ValueError, subprocess.CalledProcessError):
                      continue
                  if candidate.get("records"):
                      recovered = candidate
                      break
              if recovered:
                  state_path.write_text(json.dumps(recovered, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  print(f"已恢复 {len(recovered['records'])} 篇历史文章，随后由新门禁重新核验。")
              else:
                  print("没有找到可恢复的历史文章快照。")
          PY

      - name: Run deterministic tests
        run: python -m unittest automation.test_collector -v

      - name: Collect, enrich and generate article data
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.DEEPSEEK_API_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EASYSCHOLAR_SECRET_KEY: ${{ secrets.EASYSCHOLAR_SECRET_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          DAILY_NEW_LIMIT: ${{ inputs.max_new || '5' }}
          CANDIDATE_LIMIT: ${{ inputs.candidate_limit || '40' }}
        run: |
          mkdir -p web/generated/assets
          python automation/collector.py \
            --max-new "${DAILY_NEW_LIMIT}" \
            --candidate-limit "${CANDIDATE_LIMIT}" \
            --assets-dir web/generated/assets

      - name: Commit generated state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/automation-state.json web/generated/articles.json web/generated/run-report.json web/generated/assets
          if git diff --cached --quiet; then
            echo "没有新的状态或文章变更。"
          else
            git commit -m "chore: update daily literature reader"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
